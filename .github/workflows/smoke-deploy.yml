name: Check live deployment
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend base URL
        required: true
        default: https://askrepo-api.onrender.com
      frontend_url:
        description: Frontend base URL
        required: true
        default: https://askrepo-murex.vercel.app
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'httpx>=0.27,<1'
      - name: Verify ready demos and cited answers
        env:
          API_URL: ${{ inputs.api_url }}
          FRONTEND_URL: ${{ inputs.frontend_url }}
        run: python scripts/smoke_deploy.py "$API_URL" "$FRONTEND_URL" --wait-seconds 1800
